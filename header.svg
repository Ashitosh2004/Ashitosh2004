<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Ashitosh Krishna Ingale - Full-Stack Developer, AI Enthusiast" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .name{font-size:40px;font-weight:700;fill:#e6edf3;animation:rise .9s ease-out .1s backwards}
    .tag{font-size:13px;fill:#8b949e;letter-spacing:3px;animation:rise .9s ease-out .3s backwards}
    .role{font-size:20px;fill:#58a6ff;opacity:0}
    .r1{opacity:1;animation:cycle 9s infinite 0s}
    .r2{animation:cycle 9s infinite 3s}
    .r3{animation:cycle 9s infinite 6s}
    .cursor{fill:#58a6ff;animation:blink 1s steps(1) infinite}
    .orb{fill:#58a6ff;opacity:.08}
    .o1{animation:float 7s ease-in-out infinite}
    .o2{animation:float 9s ease-in-out infinite reverse}
    .o3{animation:float 11s ease-in-out infinite}
    .brace{font-size:120px;fill:#58a6ff;opacity:.10;font-weight:700}
    .dot{fill:#3fb950;animation:pulse 2s ease-in-out infinite}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes cycle{0%{opacity:0;transform:translateY(10px)}6%,30%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(-10px)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes float{50%{transform:translateY(-14px)}}
    @keyframes pulse{50%{opacity:.25}}
  </style>
  <rect x=".5" y=".5" width="899" height="239" rx="14" fill="#0d1117" stroke="#30363d"/>
  <circle class="orb o1" cx="760" cy="60" r="70"/>
  <circle class="orb o2" cx="840" cy="190" r="46"/>
  <circle class="orb o3" cx="640" cy="170" r="30"/>
  <text class="mono brace" x="690" y="170">{ }</text>
  <g class="mono">
    <circle class="dot" cx="46" cy="44" r="5"/>
    <text class="tag" x="62" y="49">OPEN TO BUILD  /  ASHITOSH2004</text>
    <text class="name" x="44" y="112">Ashitosh Krishna Ingale</text>
    <g transform="translate(44,160)">
      <text class="role r1" x="0" y="0">Full-Stack Developer</text>
      <text class="role r2" x="0" y="0">AI Enthusiast</text>
      <text class="role r3" x="0" y="0">Building Real-World Solutions</text>
    </g>
    <text class="tag" x="44" y="206">TYPESCRIPT  ·  JAVASCRIPT  ·  KOTLIN</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>